# ─────────────────────────────────────────
#  DriveEase — Spring Boot Configuration
# ─────────────────────────────────────────

# Server
server.port=8080

# Database  ← Change these to match your MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/driveease_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=RKnive@562001
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (change this to a long random string in production)
app.jwt.secret=DriveEase_SuperSecret_Key_2024_ChangeInProduction_XYZ
app.jwt.expiration=86400000

# CORS — allow React frontend (adjust port if different)
app.cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.driveease=DEBUG
